services:
  beacon:
    build: .
    image: abeaconsearch:local
    environment:
      BEACON_HOST: 0.0.0.0
      BEACON_LOG_LEVEL: info
      BEACON_CRAWL_MAX_PAGES: '50'
      BEACON_RATE_LIMIT_MAX: '120'
      BEACON_RATE_LIMIT_WINDOW_MS: '60000'
      BEACON_ANSWER_WEB_SEARCH: ''
      BEACON_LOOKUPS_ENABLED: 'false'
      BEACON_ANSWER_ALLOW_PRIVATE: 'false'
      BEACON_CRAWL_ALLOW_PRIVATE: 'false'
    volumes:
      - beacon-data:/data
    expose:
      - '7700'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    environment:
      BEACON_DOMAIN: ${BEACON_DOMAIN:?Set BEACON_DOMAIN in .env}
      BEACON_USER: ${BEACON_USER:?Set BEACON_USER in .env}
      BEACON_PASSWORD_HASH: ${BEACON_PASSWORD_HASH:?Set BEACON_PASSWORD_HASH in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - beacon
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - app

volumes:
  beacon-data:
  caddy-data:
  caddy-config:

networks:
  app:
